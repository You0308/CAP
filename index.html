<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cap Quotidien</title>
<meta name="theme-color" content="#F3F5F9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cap">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Nunito:wght@500;600;700&display=swap">
<style>
  /* Layout: a friendly daily companion. Greeting and streak on top, level ring, a row of week dots, then soft quest tiles. */
  :root {
    --bg: #F3F5F9;
    --surface: #FFFFFF;
    --fg: #1B2430;
    --muted: #5E6B7A;
    --line: #E1E6EE;
    --track: #E4E9F0;
    --accent: #FF6B35;
    --accent-ink: #B93A0A;
    --accent-soft: #FFEBE2;
    --on-accent: #2A1206;
    --done: #1C8A5F;
    --done-soft: #E0F3EA;
    --danger: #B3261E;
    --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
    --text: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151B;
      --surface: #1A2029;
      --fg: #EDF1F6;
      --muted: #97A3B1;
      --line: #2A3340;
      --track: #2A3340;
      --accent: #FF8458;
      --accent-ink: #FFA680;
      --accent-soft: #3A2418;
      --on-accent: #2A1206;
      --done: #4CC9A0;
      --done-soft: #16322A;
      --danger: #E0554D;
      color-scheme: dark;
    }
  }

  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html { background: var(--bg); }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--fg);
    font: 500 16px/1.5 var(--text);
    -webkit-text-size-adjust: 100%;
    padding-top: calc(env(safe-area-inset-top, 0px) + 22px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 56px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 26px; }
  button, input, select { font: inherit; color: inherit; touch-action: manipulation; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* Greeting */
  .hero { display: flex; flex-direction: column; gap: 18px; }
  .greet-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  h1 { margin: 0; font: 800 32px/1.1 var(--display); letter-spacing: -.01em; text-wrap: balance; }
  .date { margin: 4px 0 0; color: var(--muted); font-size: 15px; }
  .streak { flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); font: 800 17px var(--display); white-space: nowrap; }
  .streak svg { color: var(--accent); }
  .streak.off { background: var(--track); color: var(--muted); }
  .streak.off svg { color: var(--muted); }

  /* Level card */
  .levelcard { display: flex; align-items: center; gap: 18px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; }
  .ring { position: relative; flex: none; width: 84px; height: 84px; }
  .ring svg { display: block; transform: rotate(-90deg); }
  .ring .trk { stroke: var(--track); }
  .ring .prg { stroke: var(--accent); transition: stroke-dashoffset .5s ease; }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 800 32px var(--display); font-variant-numeric: tabular-nums; }
  .lv-text { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .lv-title { font: 800 19px/1.2 var(--display); }
  .lv-sub { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  .note { margin: 0; font-size: 17px; font-weight: 600; text-wrap: balance; }

  /* Week */
  .week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .dot { position: relative; width: 100%; max-width: 40px; aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--track) 0); }
  .dot::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--bg); }
  .dot.full { background: var(--done); color: #fff; }
  .dot.full::after { display: none; }
  .dot svg { position: relative; z-index: 1; }
  .day-lab { font-size: 13px; font-weight: 700; text-transform: uppercase; color: var(--muted); }
  .day.today .day-lab { color: var(--fg); }

  /* Quests */
  .section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  h2 { margin: 0; font: 800 24px/1.15 var(--display); letter-spacing: -.005em; text-wrap: balance; }
  .meta { margin-top: 2px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .link-btn { background: none; border: 0; padding: 8px 0 8px 8px; color: var(--accent-ink); font-weight: 800; cursor: pointer; }
  ul.quests { list-style: none; margin: 14px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .row { width: 100%; display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 14px 16px; min-height: 66px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; text-align: left; cursor: pointer; }
  .row.edit { cursor: default; grid-template-columns: minmax(0, 1fr) auto auto; }
  .box { width: 30px; height: 30px; border: 2px solid var(--muted); border-radius: 50%; display: grid; place-items: center; color: transparent; transition: background .15s ease, border-color .15s ease; }
  .name { overflow-wrap: anywhere; font-weight: 700; }
  .xp { padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); font: 800 13px var(--text); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row.done { background: var(--done-soft); border-color: transparent; }
  .row.done .box { background: var(--done); border-color: var(--done); color: #fff; }
  .row.done .name { color: var(--muted); }
  .row.done .xp { background: transparent; color: var(--done); }
  .row.just .box { animation: pop .3s ease; }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.22); } 100% { transform: scale(1); } }
  .remove { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; font-size: 14px; font-weight: 700; }
  .remove.confirm { background: var(--danger); border-color: var(--danger); color: #fff; }
  .bonus { margin-top: 12px; padding: 14px 16px; border-radius: 18px; background: var(--done-soft); color: var(--done); font-weight: 800; }
  .empty { padding: 20px 4px; color: var(--muted); }

  .editor { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .editor input[type="text"] { flex: 1 1 200px; min-width: 0; }
  .editor input, .editor select { padding: 13px 14px; font-size: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .primary { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 14px; padding: 13px 20px; font-weight: 800; cursor: pointer; }

  .status { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }

  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 22px); transform: translate(-50%, 12px); max-width: calc(100% - 32px); padding: 11px 18px; border-radius: 999px; background: var(--fg); color: var(--bg); font-weight: 700; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    .ring .prg, .box, .toast { transition: none; }
    .row.just .box { animation: none; }
  }
</style>
</head>
<body>
<main class="wrap">
  <section class="hero" id="hero" aria-label="Ton résumé du jour"></section>

  <section aria-label="Les 7 derniers jours">
    <div class="week" id="week"></div>
  </section>

  <section>
    <div class="section-head">
      <h2>Tes quêtes du jour</h2>
      <button class="link-btn" id="edit-toggle" type="button" aria-pressed="false">Modifier</button>
    </div>
    <div class="meta" id="list-meta"></div>
    <ul class="quests" id="list"></ul>
    <div id="bonus"></div>
    <form class="editor" id="editor" hidden>
      <input type="text" id="quest-name" maxlength="60" placeholder="Nouvelle quête, par ex. Marcher : 20 min minimum" aria-label="Nom de la quête" required>
      <select id="quest-xp" aria-label="XP de la quête">
        <option value="10">10 XP</option>
        <option value="20" selected>20 XP</option>
        <option value="30">30 XP</option>
        <option value="40">40 XP</option>
      </select>
      <button class="primary" type="submit">Ajouter</button>
    </form>
  </section>

  <div class="status" id="status" role="status"></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  var NAME = "Younis";
  var LS = "cap-quotidien-v1";
  var BONUS = 20;
  var TITLES = ["Recrue", "Apprenti", "Régulier", "Endurant", "Discipliné", "Aguerri", "Vétéran", "Maître"];
  var MESSAGES = [
    "Une seule quête pour commencer. Le reste suivra.",
    "Pas besoin d'être motivé. Lance-toi, la motivation arrive en route.",
    "Aujourd'hui compte autant que les autres jours de ta série.",
    "Commence par la plus facile, histoire de prendre l'élan.",
    "Faire le minimum, c'est déjà faire. Et souvent tu iras plus loin.",
    "Ce n'est pas la perfection qui te change, c'est la répétition.",
    "Tu t'es fixé un cap. Tiens-le, même un peu."
  ];
  var CHEERS = ["Bien joué.", "Une de plus.", "Tu avances.", "Solide.", "Continue comme ça."];
  var OLD = { sport: "Sport 30 minutes", lecture: "Lire 20 minutes", code: "Coder 30 minutes", eau: "Boire 2 L d'eau", plan: "Planifier la journée (5 min)", ecrans: "Éteindre les écrans avant 23 h" };
  var NEW = { sport: "Sport : 30 min minimum", lecture: "Lecture : 20 min minimum", code: "Code : 30 min minimum", eau: "Eau : 2 L minimum", plan: "Planifier ma journée : 5 min minimum" };
  var CHECK = '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var FLAME = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 2c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.2 2-4.2.2 1.4 1 2.2 2 2.4C10.6 7.6 10.8 4.6 12 2z" fill="currentColor"/></svg>';

  function $(s) { return document.querySelector(s); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function key(d) {
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  var today = key(new Date());
  var state = null;
  var editMode = false;
  var confirmId = null;
  var lastFocus = null;
  var popId = null;
  var saveFailed = false;
  var toastTimer = null;

  function defaultQuests() {
    return [
      { id: "sport", name: NEW.sport, xp: 30 },
      { id: "lecture", name: NEW.lecture, xp: 20 },
      { id: "code", name: NEW.code, xp: 20 },
      { id: "eau", name: NEW.eau, xp: 10 },
      { id: "plan", name: NEW.plan, xp: 10 }
    ];
  }

  function normalize(raw) {
    var s = { v: 1, quests: [], days: {} };
    var droppedScreens = false;
    if (raw && Array.isArray(raw.quests)) {
      s.quests = raw.quests.filter(function (q) {
        if (!q || !q.id || !q.name) return false;
        if (q.id === "ecrans" && q.name === OLD.ecrans) { droppedScreens = true; return false; }
        return true;
      }).map(function (q) {
        var name = String(q.name).slice(0, 60);
        if (NEW[q.id] && name === OLD[q.id]) name = NEW[q.id];
        return { id: String(q.id), name: name, xp: Math.max(5, Math.min(100, +q.xp || 10)) };
      });
    } else {
      s.quests = defaultQuests();
    }
    var days = raw && raw.days && typeof raw.days === "object" ? raw.days : {};
    Object.keys(days).forEach(function (k) {
      var r = days[k];
      if (!r || typeof r !== "object") return;
      if (r.d && typeof r.d === "object") {
        var d = {};
        Object.keys(r.d).forEach(function (id) { if (isFinite(+r.d[id])) d[id] = +r.d[id]; });
        var t = +r.t || 0;
        if (droppedScreens) { delete d.ecrans; t = Math.max(0, t - 1); }
        s.days[k] = { d: d, t: t };
      } else {
        s.days[k] = { n: +r.n || 0, x: +r.x || 0, t: +r.t || 0 };
      }
    });
    compact(s);
    return s;
  }

  function compact(s) {
    Object.keys(s.days).forEach(function (k) {
      var r = s.days[k];
      if (k < today && r.d) {
        var ids = Object.keys(r.d);
        s.days[k] = { n: ids.length, x: ids.reduce(function (a, id) { return a + r.d[id]; }, 0), t: r.t };
      }
    });
  }

  function countOf(r) { return !r ? 0 : (r.d ? Object.keys(r.d).length : (r.n || 0)); }
  function xpOf(r) { return !r ? 0 : (r.d ? Object.keys(r.d).reduce(function (a, id) { return a + r.d[id]; }, 0) : (r.x || 0)); }
  function totalOf(k) { return k === today ? state.quests.length : ((state.days[k] && state.days[k].t) || 0); }
  function complete(k) { var t = totalOf(k); return t > 0 && countOf(state.days[k]) >= t; }

  function totalXP() {
    var t = 0;
    Object.keys(state.days).forEach(function (k) {
      t += xpOf(state.days[k]);
      if (complete(k)) t += BONUS;
    });
    return t;
  }

  function streak() {
    var n = 0, d = new Date();
    if (!complete(key(d))) d.setDate(d.getDate() - 1);
    for (var i = 0; i < 3650; i++) {
      if (complete(key(d))) { n++; d.setDate(d.getDate() - 1); } else break;
    }
    return n;
  }

  /* Persistence: this device only */
  function persist() {
    try { localStorage.setItem(LS, JSON.stringify(state)); saveFailed = false; } catch (e) { saveFailed = true; }
    render();
  }

  function toast(msg) {
    var t = $("#toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2000);
  }

  /* Actions */
  function toggle(id) {
    var q = state.quests.filter(function (x) { return x.id === id; })[0];
    if (!q) return;
    var r = state.days[today];
    if (!r || !r.d) r = state.days[today] = { d: {}, t: state.quests.length };
    var nowDone;
    if (r.d[id] !== undefined) { delete r.d[id]; nowDone = false; } else { r.d[id] = q.xp; nowDone = true; }
    r.t = state.quests.length;
    lastFocus = id;
    popId = nowDone ? id : null;
    persist();
    if (nowDone) {
      var all = state.quests.length > 0 && countOf(r) >= state.quests.length;
      toast(all ? "Journée validée. Bravo " + NAME + "." : CHEERS[countOf(r) % CHEERS.length]);
    }
  }

  function addQuest(name, xp) {
    var id = "q" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    state.quests.push({ id: id, name: name, xp: xp });
    var r = state.days[today];
    if (r && r.d) r.t = state.quests.length;
    persist();
  }

  function removeQuest(id) {
    state.quests = state.quests.filter(function (q) { return q.id !== id; });
    var r = state.days[today];
    if (r && r.d) { delete r.d[id]; r.t = state.quests.length; }
    confirmId = null;
    persist();
  }

  /* Words */
  function greeting() {
    var h = new Date().getHours();
    return (h < 12 ? "Bonjour" : (h < 18 ? "Salut" : "Bonsoir")) + ", " + NAME;
  }

  function dailyMessage(s) {
    var now = new Date();
    var done = countOf(state.days[today]);
    var total = state.quests.length;
    var left = total - done;
    if (total > 0 && left <= 0) return "Journée validée. Tu as tenu ta parole, et ça se sent.";
    if (s > 0 && now.getHours() >= 18) return "Ta série de " + s + (s === 1 ? " jour" : " jours") + " se joue ce soir. Plus que " + left + (left === 1 ? " quête" : " quêtes") + ", tu y es presque.";
    var start = new Date(now.getFullYear(), 0, 0);
    var dayOfYear = Math.floor((now - start) / 86400000);
    return MESSAGES[dayOfYear % MESSAGES.length];
  }

  /* Rendering */
  function renderHero() {
    var tot = totalXP();
    var L = Math.floor(Math.sqrt(tot / 100)) + 1;
    var start = 100 * Math.pow(L - 1, 2), next = 100 * L * L;
    var frac = (tot - start) / (next - start);
    var pct = Math.round(frac * 100);
    var C = 2 * Math.PI * 36;
    var s = streak();
    var date = new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
    $("#hero").innerHTML =
      '<div class="greet-row"><div><h1>' + esc(greeting()) + '</h1><p class="date">' + esc(date) + '</p></div>' +
        '<div class="streak' + (s === 0 ? " off" : "") + '">' + FLAME + '<span>' + (s === 0 ? "Série à lancer" : s + (s === 1 ? " jour" : " jours")) + '</span></div></div>' +
      '<div class="levelcard">' +
        '<div class="ring" role="img" aria-label="Niveau ' + L + ', ' + pct + ' % vers le niveau suivant">' +
          '<svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true"><circle class="trk" cx="42" cy="42" r="36" fill="none" stroke-width="8"/>' +
          '<circle class="prg" cx="42" cy="42" r="36" fill="none" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + (C * (1 - frac)).toFixed(1) + '"/></svg><b>' + L + '</b></div>' +
        '<div class="lv-text"><div class="lv-title">Niveau ' + L + ' · ' + TITLES[Math.min(L - 1, TITLES.length - 1)] + '</div>' +
        '<div class="lv-sub">' + tot + ' XP au total</div><div class="lv-sub">Encore ' + (next - tot) + ' XP pour le niveau ' + (L + 1) + '</div></div>' +
      '</div>' +
      '<p class="note">' + esc(dailyMessage(s)) + '</p>';
  }

  function renderWeek() {
    var html = "";
    for (var i = 6; i >= 0; i--) {
      var d = new Date();
      d.setDate(d.getDate() - i);
      var k = key(d);
      var t = totalOf(k), c = countOf(state.days[k]);
      var ratio = t > 0 ? Math.min(1, c / t) : 0;
      var full = ratio >= 1;
      var label = d.toLocaleDateString("fr-FR", { weekday: "narrow" });
      var long = d.toLocaleDateString("fr-FR", { weekday: "long" });
      html += '<div class="day' + (k === today ? " today" : "") + '">' +
        '<div class="dot' + (full ? " full" : "") + '" style="--p:' + Math.round(ratio * 100) + '" role="img" aria-label="' + long + " : " + c + " sur " + t + '">' + (full ? CHECK : "") + '</div>' +
        '<span class="day-lab">' + label + '</span></div>';
    }
    $("#week").innerHTML = html;
  }

  function renderList() {
    var r = state.days[today];
    var done = r && r.d ? r.d : {};
    var n = Object.keys(done).length;
    var xp = xpOf(r);
    $("#list-meta").textContent = state.quests.length ? (n + " sur " + state.quests.length + " faites · " + xp + " XP gagnés aujourd’hui") : "";
    if (!state.quests.length) {
      $("#list").innerHTML = '<li class="empty">Pas encore de quête. Touche « Modifier » pour ajouter la première.</li>';
    } else {
      $("#list").innerHTML = state.quests.map(function (q) {
        if (editMode) {
          return '<li><div class="row edit"><span class="name">' + esc(q.name) + '</span><span class="xp">' + q.xp + ' XP</span>' +
            '<button type="button" class="remove' + (confirmId === q.id ? " confirm" : "") + '" data-remove="' + q.id + '">' + (confirmId === q.id ? "Confirmer" : "Retirer") + '</button></div></li>';
        }
        var isDone = done[q.id] !== undefined;
        return '<li><button type="button" class="row' + (isDone ? " done" : "") + (popId === q.id ? " just" : "") + '" data-toggle="' + q.id + '" aria-pressed="' + isDone + '">' +
          '<span class="box">' + CHECK + '</span><span class="name">' + esc(q.name) + '</span><span class="xp">+' + q.xp + ' XP</span></button></li>';
      }).join("");
    }
    var all = state.quests.length > 0 && n >= state.quests.length;
    $("#bonus").innerHTML = all ? '<div class="bonus">Journée validée. +' + BONUS + ' XP de bonus, tu les as mérités.</div>' : "";
    popId = null;
    if (lastFocus) {
      var el = document.querySelector('[data-toggle="' + lastFocus + '"]');
      if (el) el.focus();
      lastFocus = null;
    }
  }

  function renderStatus() {
    var standalone = window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
    var html = saveFailed
      ? "Sauvegarde impossible sur cet appareil. Tes derniers changements risquent d'être perdus."
      : "Tes données restent sur cet iPhone. Si tu supprimes l'app, ta progression part avec.";
    if (!standalone) html += "<span>Pour l'installer : touche Partager dans Safari, puis « Sur l'écran d'accueil ».</span>";
    $("#status").innerHTML = html;
  }

  function render() { renderHero(); renderWeek(); renderList(); renderStatus(); }

  /* Events */
  $("#list").addEventListener("click", function (e) {
    var t = e.target.closest("[data-toggle]");
    if (t) { toggle(t.getAttribute("data-toggle")); return; }
    var rm = e.target.closest("[data-remove]");
    if (rm) {
      var id = rm.getAttribute("data-remove");
      if (confirmId === id) removeQuest(id); else { confirmId = id; renderList(); }
    }
  });

  $("#edit-toggle").addEventListener("click", function () {
    editMode = !editMode;
    confirmId = null;
    this.textContent = editMode ? "Terminé" : "Modifier";
    this.setAttribute("aria-pressed", String(editMode));
    $("#editor").hidden = !editMode;
    renderList();
  });

  $("#editor").addEventListener("submit", function (e) {
    e.preventDefault();
    var input = $("#quest-name");
    var name = input.value.trim();
    if (!name) return;
    addQuest(name, +$("#quest-xp").value);
    input.value = "";
    input.focus();
  });

  function rollover() {
    var k = key(new Date());
    if (k !== today) { today = k; compact(state); }
    render();
  }
  setInterval(rollover, 60000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) rollover(); });

  /* Boot */
  var raw = null;
  try { raw = JSON.parse(localStorage.getItem(LS) || "null"); } catch (e) {}
  state = normalize(raw);
  render();

  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
})();
</script>
</body>
</html>
